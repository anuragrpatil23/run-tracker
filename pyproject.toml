[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "run-tracker"
version = "0.1.0"
description = "Watch, compare and keep training runs that are written to files"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
rt = "runtracker.cli:main"

[tool.setuptools]
py-modules = ["tracker"]
packages = ["runtracker"]

[tool.setuptools.package-data]
runtracker = ["static/*"]
